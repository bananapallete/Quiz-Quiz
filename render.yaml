# Render 배포 설정 (Blueprint)
# Render 대시보드에서 New + → Blueprint → 이 저장소를 선택하면 자동으로 읽힙니다.
services:
  - type: web
    name: quiz-quiz
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /health
    # Socket.IO 는 한 서버에 연결이 붙어 있어야 하므로 인스턴스를 늘리지 마세요.
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        # sync: false → 배포할 때 Render 가 직접 값을 물어봅니다. (저장소에 비밀번호를 남기지 않음)
        sync: false
